name: RAZZO Shard Worker
on:
  push:
    paths:
      - '.razzo/shard.json'
  workflow_dispatch:
    inputs:
      execution_id: {required: false, type: string}
      work_item_id: {required: false, type: string}
      project_id: {required: false, type: string}
      generation_id: {required: false, type: string}
      input_sha: {required: false, type: string}
      collision_domain: {required: false, type: string}
      idempotency_key: {required: false, type: string}
permissions:
  contents: read
jobs:
  self-health:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provisioned shard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.razzo/shard.json').read_text())
          assert p['schema']=='razzo.shard.v1'
          assert p['state']=='PROVISIONED'
          assert p['exact_sha_required'] is True
          assert p['collision_domain_lease_required'] is True
          assert p['idempotency_required'] is True
          assert p['product_progress'] is False
          print('RAZZO SHARD HEALTHY', p['shard_id'])
          PY
      - name: Emit self-health receipt
        shell: bash
        run: |
          mkdir -p receipts
          printf '%s\n' "{\"status\":\"HEALTHY\",\"verification_state\":\"SELF_HEALTH_VERIFIED\",\"shard_repository\":\"${GITHUB_REPOSITORY}\",\"exact_sha\":\"${GITHUB_SHA}\",\"product_progress\":false}" > receipts/self-health.json
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-self-health-${{ github.sha }}
          path: receipts/self-health.json
  execute:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dispatch envelope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.execution_id }}"
          test -n "${{ inputs.work_item_id }}"
          test -n "${{ inputs.input_sha }}"
          test -n "${{ inputs.idempotency_key }}"
          echo "RAZZO shard dispatch envelope accepted"
      - name: Emit execution receipt
        shell: bash
        run: |
          mkdir -p receipts
          printf '%s\n' "{\"status\":\"HEALTHY\",\"verification_state\":\"DISPATCH_ENVELOPE_VERIFIED\",\"exact_sha\":\"${GITHUB_SHA}\",\"product_progress\":false}" > "receipts/${{ inputs.execution_id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: razzo-receipt-${{ inputs.execution_id }}
          path: receipts/${{ inputs.execution_id }}.json
