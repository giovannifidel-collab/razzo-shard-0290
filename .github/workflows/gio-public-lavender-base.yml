name: GIO OS Public Lavender Source Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gio-public-lavender-base.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gio-public-lavender-source-base
  cancel-in-progress: false

env:
  GEN: v2-20260902
  AOSP_ROOT: /mnt/gio-a14
  OUT_ROOT: /mnt/gio-out
  BUILD_NUMBER: GIOPUBLICA14
  BUILD_USERNAME: gio-public-fabric
  BUILD_HOSTNAME: razzo-public-builder

jobs:
  build:
    name: public-lavender-target-files
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout public orchestration only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Mount verified 16-pack public Android source fabric
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci/gio_public_diskless_setup.sh" "$AOSP_ROOT" "$OUT_ROOT" "$GEN"

      - name: Add generic private-core loading hook
        shell: bash
        run: |
          set -euo pipefail
          cd "$AOSP_ROOT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frameworks/base/services/java/com/android/server/SystemServer.java')
          text = path.read_text()
          marker = '// GIO_OS_PRIVATE_CORE_JAR_HOOK_V1'
          if marker not in text:
              anchors = [
                  'private void startOtherServices(@NonNull TimingsTraceAndSlog t) {',
                  'private void startOtherServices(TimingsTraceAndSlog t) {',
              ]
              anchor = next((a for a in anchors if a in text), None)
              if anchor is None:
                  raise SystemExit('unsupported SystemServer startOtherServices anchor')
              hook = '''\n        // GIO_OS_PRIVATE_CORE_JAR_HOOK_V1\n        try {\n            mSystemServiceManager.startServiceFromJar(\n                    "com.android.server.gioos.GioOsManagerService",\n                    "/system/framework/gioos-services.jar");\n        } catch (RuntimeException e) {\n            Slog.i(TAG, "GIO OS private Secure Core is not installed in this public base");\n        }\n'''
              path.write_text(text.replace(anchor, anchor + hook, 1))
          verify = path.read_text()
          required = [marker, 'startServiceFromJar(', 'com.android.server.gioos.GioOsManagerService', '/system/framework/gioos-services.jar']
          if not all(x in verify for x in required):
              raise SystemExit('generic GIO jar hook verification failed')
          print('GIO_PUBLIC_PRIVATE_CORE_HOOK=PASS')
          PY
          test ! -e vendor/gioos
          ! grep -R --exclude='SystemServer.java' -l 'class GioOsManagerService' frameworks 2>/dev/null | grep -q .

      - name: Build unsigned public target-files and OTA tools
        shell: bash
        run: |
          set -eo pipefail
          cd "$AOSP_ROOT"
          set +u
          source build/envsetup.sh
          lunch lineage_lavender-ap2a-userdebug
          export BUILD_NUMBER="$BUILD_NUMBER"
          export BUILD_USERNAME="$BUILD_USERNAME"
          export BUILD_HOSTNAME="$BUILD_HOSTNAME"

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          : > "$RUNNER_TEMP/gio-public-build.log"
          : > "$RUNNER_TEMP/gio-public-resources.log"
          (
            while true; do
              printf '\n=== PUBLIC_RUNNER_HEARTBEAT %s ===\n' "$(date -u +%FT%TZ)"
              df -hT / /mnt || true
              free -h || true
              ps -eo pid,ppid,pcpu,pmem,rss,comm --sort=-rss | head -n 12 || true
              sleep 600
            done
          ) 2>&1 | tee -a "$RUNNER_TEMP/gio-public-resources.log" &
          MON_PID=$!

          set +e
          nice -n 5 ionice -c2 -n5 build/soong/soong_ui.bash --make-mode target-files-package otatools-package -j4 \
            > >(tee -a "$RUNNER_TEMP/gio-public-build.log") 2>&1
          BUILD_RC=$?
          set -e
          kill "$MON_PID" >/dev/null 2>&1 || true
          wait "$MON_PID" >/dev/null 2>&1 || true

          if [ "$BUILD_RC" -ne 0 ]; then
            tail -n 12000 "$RUNNER_TEMP/gio-public-build.log" > "$GITHUB_WORKSPACE/diagnostics/build-tail.log" || true
            cp "$RUNNER_TEMP/gio-public-resources.log" "$GITHUB_WORKSPACE/diagnostics/resource.log" || true
            { df -hT / /mnt; free -h; } > "$GITHUB_WORKSPACE/diagnostics/final-resources.txt" 2>&1 || true
            printf 'build_rc=%s\nsourcepack_generation=%s\nstrategy=public-diskless-16pack-j4\n' "$BUILD_RC" "$GEN" \
              > "$GITHUB_WORKSPACE/diagnostics/FAILURE.env"
            exit "$BUILD_RC"
          fi

      - name: Collect verified public base artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/gio-public-base"
          target_files="$(find "$OUT_ROOT" -type f -name '*target_files*.zip' -printf '%T@ %p\n' | sort -nr | awk 'NR==1 {$1=""; sub(/^ /,""); print; exit}')"
          otatools="$(find "$OUT_ROOT" -type f -name 'otatools.zip' -printf '%T@ %p\n' | sort -nr | awk 'NR==1 {$1=""; sub(/^ /,""); print; exit}')"
          test -n "$target_files" -a -f "$target_files"
          test -n "$otatools" -a -f "$otatools"
          unzip -t "$target_files" >/dev/null
          unzip -t "$otatools" >/dev/null
          cp "$target_files" "$GITHUB_WORKSPACE/gio-public-base/lavender-public-target_files.zip"
          cp "$otatools" "$GITHUB_WORKSPACE/gio-public-base/otatools.zip"
          cp "$RUNNER_TEMP/gio-public-build.log" "$GITHUB_WORKSPACE/gio-public-base/build.log"
          sha256sum "$GITHUB_WORKSPACE/gio-public-base/lavender-public-target_files.zip" \
                    "$GITHUB_WORKSPACE/gio-public-base/otatools.zip" \
            > "$GITHUB_WORKSPACE/gio-public-base/SHA256SUMS"
          printf '%s\n' \
            'provenance=public-diskless-sourcepack-build' \
            'target=lavender' \
            'android=14' \
            'release=ap2a' \
            'sourcepack_generation=v2-20260902' \
            'device_sha=fd2a90e734a101fad046736970fa4dfb492d7d78' \
            'kernel_sha=b7b27af5994f7afc11f69cfef194a8dc738842b4' \
            'vendor_sha=483e3e7ca5828c54d8b4408b87ee14069a8d027b' \
            'generic_gio_private_jar_hook=true' \
            'private_gio_source_present=false' \
            'signing_keys_present=false' \
            'hardware_validated=false' \
            > "$GITHUB_WORKSPACE/gio-public-base/PROVENANCE.env"
          echo PUBLIC_TARGET_FILES=READY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gio-public-lavender-build-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload unsigned public lavender base
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gio-lavender-public-target-files-${{ github.sha }}
          path: gio-public-base/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Cleanup public remote mounts
        if: always()
        shell: bash
        run: |
          set +e
          sudo umount "$AOSP_ROOT" >/dev/null 2>&1 || true
          for mp in /mnt/gio-lower/*; do [ -d "$mp" ] && sudo umount "$mp" >/dev/null 2>&1 || true; done
          sudo dmsetup ls --noheadings -o name 2>/dev/null | awk '/^gio-public-pack-/ {print $1}' | xargs -r -n1 sudo dmsetup remove -f >/dev/null 2>&1 || true
          for dev in /dev/nbd*; do [ -b "$dev" ] && timeout 2s sudo nbd-client -d "$dev" >/dev/null 2>&1 || true; done
          sudo pkill -f 'nbdkit' >/dev/null 2>&1 || true
