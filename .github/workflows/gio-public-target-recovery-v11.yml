name: GIO OS Public Target Recovery v11
on:
  workflow_dispatch:
    inputs:
      stage: {description: Recovery slice, required: false, default: '1'}
  push:
    branches: [main]
    paths: ['.github/workflows/gio-public-target-recovery-v11.yml']
permissions: {contents: write, actions: write}
env:
  BASELINE_CACHE_TAG: gio-a14-lavender-compilecache-v1-6e2d7d62d9e5
  PREVIOUS_RECOVERY_CACHE_TAG: gio-a14-lavender-recovery-cache-v10
  RECOVERY_CACHE_TAG: gio-a14-lavender-recovery-cache-v11
  PUBLIC_BASE_TAG: gio-a14-lavender-public-base-v3
  GEN: v2-20260902
  AOSP_ROOT: /mnt/gio-a14
  OUT_ROOT: /mnt/gio-out
  CCACHE_DIR: /tmp/gio-target-ccache
  CCACHE_MAXSIZE: 512M
  DEVICE_SHA: fd2a90e734a101fad046736970fa4dfb492d7d78
  KERNEL_SHA: b7b27af5994f7afc11f69cfef194a8dc738842b4
  VENDOR_SHA: 483e3e7ca5828c54d8b4408b87ee14069a8d027b
  GIO_SHA: 31103989996a664dff385896143dccd03072cdf6
  LOCALIZE_PUBLIC_PACKS: '0'
  PUBLIC_OUT_RESERVE_GB: '28'
concurrency: {group: gio-public-target-recovery-v11, cancel-in-progress: false}
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAGE: ${{ inputs.stage || '1' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Mount and verify immutable public fabric
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci/gio_public_diskless_setup.sh" "$AOSP_ROOT" "$OUT_ROOT" "$GEN"
          bash "$GITHUB_WORKSPACE/ci/gio_public_apply_hook.sh" "$AOSP_ROOT"
          test "$GEN" = v2-20260902
          test "$GIO_SHA" = 31103989996a664dff385896143dccd03072cdf6
          test "$DEVICE_SHA" = fd2a90e734a101fad046736970fa4dfb492d7d78
          test "$KERNEL_SHA" = b7b27af5994f7afc11f69cfef194a8dc738842b4
          test "$VENDOR_SHA" = 483e3e7ca5828c54d8b4408b87ee14069a8d027b
      - name: Restore exact Lineage kernel-header definition
        run: |
          set -euo pipefail
          bp="$AOSP_ROOT/vendor/lineage/build/soong/Android.bp"
          if [ -s "$bp" ] && grep -q 'name: "generated_kernel_headers"' "$bp"; then exit 0; fi
          meta=/mnt/gio-meta/11/pack-11-projects.json; test -s "$meta"
          s="$(jq -r '.projects[]|select(.path=="vendor/lineage")|.sha' "$meta")"; test -n "$s" -a "$s" != null
          curl -fL --retry 8 --retry-all-errors --connect-timeout 20 "https://raw.githubusercontent.com/crdroidandroid/android_vendor_crdroid/${s}/build/soong/Android.bp" -o "$RUNNER_TEMP/lineage.bp"
          grep -q 'name: "generated_kernel_headers"' "$RUNNER_TEMP/lineage.bp"; cp "$RUNNER_TEMP/lineage.bp" "$bp"
      - name: Restore verified compiler caches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/cache"; r="$RUNNER_TEMP/recovery"; rm -rf "$d" "$r" "$CCACHE_DIR"; mkdir -p "$d" "$r" "$CCACHE_DIR"
          gh release download "$BASELINE_CACHE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ccache-shard-*.tar' --pattern 'ccache-shard-*.tar.sha256' --dir "$d"
          mapfile -t c < <(find "$d" -name 'ccache-shard-*.tar' -type f|sort); test "${#c[@]}" -ge 30
          for f in "${c[@]}"; do test "$(sha256sum "$f"|awk '{print $1}')" = "$(awk 'NR==1{print $1}' "$f.sha256")"; tar -C "$CCACHE_DIR" -xf "$f"; done
          tag=''; if gh release view "$RECOVERY_CACHE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then tag="$RECOVERY_CACHE_TAG"; elif gh release view "$PREVIOUS_RECOVERY_CACHE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then tag="$PREVIOUS_RECOVERY_CACHE_TAG"; fi
          if [ -n "$tag" ]; then gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern recovery-ccache.tar.zst --pattern recovery-ccache.tar.zst.sha256 --dir "$r" || true; a="$r/recovery-ccache.tar.zst"; if [ -s "$a" ] && [ -s "$a.sha256" ]; then test "$(sha256sum "$a"|awk '{print $1}')" = "$(awk 'NR==1{print $1}' "$a.sha256")"; zstd -dc "$a"|tar -C "$CCACHE_DIR" -xf -; fi; fi
          ccache --max-size "$CCACHE_MAXSIZE" >/dev/null
      - name: Bounded bootstrap compile and checkpoint
        id: build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd "$AOSP_ROOT"; export USE_CCACHE=1 CCACHE_DIR="$CCACHE_DIR" CCACHE_MAXSIZE="$CCACHE_MAXSIZE" CCACHE_BASEDIR="$AOSP_ROOT" CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content CCACHE_EXEC="$(command -v ccache)" GOGC=10; unset CCACHE_DISABLE || true
          log="$RUNNER_TEMP/slice.log"; runner="$RUNNER_TEMP/run.sh"
          cat >"$runner" <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$AOSP_ROOT"; set +u; source build/envsetup.sh; set -u
          export TARGET_PRODUCT=lineage_lavender TARGET_RELEASE=ap2a TARGET_BUILD_VARIANT=userdebug
          exec nice -n 10 ionice -c2 -n7 build/soong/soong_ui.bash --make-mode target-files-package otatools-package -j1
          EOS
          chmod +x "$runner"; set +e; setsid bash "$runner" > >(tee "$log") 2>&1 & p=$!; rc=0; deadline=$((SECONDS+720))
          while kill -0 "$p" 2>/dev/null; do if [ "$SECONDS" -ge "$deadline" ]; then echo SLICE_EXPIRED=1; kill -TERM -- "-$p" 2>/dev/null||true; sleep 10; kill -KILL -- "-$p" 2>/dev/null||true; wait "$p" 2>/dev/null||true; rc=124; break; fi; sleep 15; done
          if [ "$rc" -eq 0 ]; then wait "$p"; rc=$?; fi; set -e; echo SLICE_RC=$rc
          tf="$(find "$OUT_ROOT" -type f -name '*target_files*.zip' -print -quit 2>/dev/null||true)"; ota="$(find "$OUT_ROOT" -type f -name otatools.zip -print -quit 2>/dev/null||true)"
          if [ -n "$tf" ] && [ -n "$ota" ]; then echo complete=true >>"$GITHUB_OUTPUT"; exit 0; fi
          echo complete=false >>"$GITHUB_OUTPUT"; case "$rc" in 0|124|137|143) ;; *) tail -n 300 "$log"||true; exit "$rc";; esac
          ccache --cleanup >/dev/null||true; a="$RUNNER_TEMP/recovery-ccache.tar.zst"; tar -C "$CCACHE_DIR" -cf - .|zstd -1 -T2 -o "$a"; test -s "$a"; sha256sum "$a">"$a.sha256"
          if ! gh release view "$RECOVERY_CACHE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release create "$RECOVERY_CACHE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'GIO OS Lavender recovery ccache v11' --notes 'Public compiler cache only; immutable product pins unchanged.' --prerelease; fi
          gh release upload "$RECOVERY_CACHE_TAG" "$a" "$a.sha256" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Queue successor
        if: ${{ steps.build.outputs.complete != 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; s="${STAGE:-1}"; case "$s" in (*[!0-9]*|'') s=1;; esac; test "$s" -lt 64; gh workflow run gio-public-target-recovery-v11.yml --repo "$GITHUB_REPOSITORY" --ref main -f stage="$((s+1))"
      - name: Publish verified public base
        if: ${{ steps.build.outputs.complete == 'true' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; d="$RUNNER_TEMP/base"; mkdir -p "$d"; tf="$(find "$OUT_ROOT" -type f -name '*target_files*.zip' -print -quit)"; ota="$(find "$OUT_ROOT" -type f -name otatools.zip -print -quit)"; unzip -t "$tf">/dev/null; unzip -t "$ota">/dev/null; cp "$tf" "$d/lavender-public-target_files.zip"; cp "$ota" "$d/otatools.zip"; cd "$d"; sha256sum lavender-public-target_files.zip otatools.zip>SHA256SUMS
          printf '%s\n' 'schema=gio.os.public-base.v3' 'sourcepack_generation=v2-20260902' 'target=lavender' 'device_sha=fd2a90e734a101fad046736970fa4dfb492d7d78' 'kernel_sha=b7b27af5994f7afc11f69cfef194a8dc738842b4' 'vendor_sha=483e3e7ca5828c54d8b4408b87ee14069a8d027b' 'private_gio_source_present=false' 'hardware_validated=false'>PROVENANCE.env
          if ! gh release view "$PUBLIC_BASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release create "$PUBLIC_BASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'GIO OS Lavender verified public base v3' --prerelease; fi
          gh release upload "$PUBLIC_BASE_TAG" lavender-public-target_files.zip otatools.zip SHA256SUMS PROVENANCE.env --repo "$GITHUB_REPOSITORY" --clobber
      - name: Cleanup
        if: always()
        run: |
          set +e; sudo umount "$AOSP_ROOT" >/dev/null 2>&1||true; for m in /mnt/gio-lower/*; do [ -d "$m" ]&&sudo umount "$m" >/dev/null 2>&1||true; done; sudo pkill -f nbdkit >/dev/null 2>&1||true
