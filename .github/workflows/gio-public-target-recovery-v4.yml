name: GIO OS Public Target Recovery v4

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Recovery slice number
        required: false
        default: '1'
  push:
    branches: [main]
    paths: ['.github/workflows/gio-public-target-recovery-v4.yml']

permissions:
  contents: write
  actions: write

env:
  GEN: v2-20260902
  AOSP_ROOT: /mnt/gio-a14
  OUT_ROOT: /mnt/gio-out
  DEVICE_SHA: fd2a90e734a101fad046736970fa4dfb492d7d78
  KERNEL_SHA: b7b27af5994f7afc11f69cfef194a8dc738842b4
  VENDOR_SHA: 483e3e7ca5828c54d8b4408b87ee14069a8d027b
  PUBLIC_BASE_TAG: gio-a14-lavender-public-base-v4
  LOCALIZE_PUBLIC_PACKS: '0'
  PUBLIC_OUT_RESERVE_GB: '28'
  BUILD_NUMBER: GIOPUBLICA14RECOVERYV4
  BUILD_USERNAME: gio-public-recovery
  BUILD_HOSTNAME: razzo-public-recovery

concurrency:
  group: gio-public-target-recovery-v4
  cancel-in-progress: false

jobs:
  target-files:
    name: recover-public-target-files-persistent-out
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAGE: ${{ inputs.stage || '1' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Mount exact public source fabric on demand
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci/gio_public_diskless_setup.sh" "$AOSP_ROOT" "$OUT_ROOT" "$GEN"
          bash "$GITHUB_WORKSPACE/ci/gio_public_apply_hook.sh" "$AOSP_ROOT"
      - name: Restore exact Lineage Soong kernel-header definition if needed
        shell: bash
        run: |
          set -euo pipefail
          bp="$AOSP_ROOT/vendor/lineage/build/soong/Android.bp"
          if [ -s "$bp" ] && grep -q 'name: "generated_kernel_headers"' "$bp"; then echo GENERATED_KERNEL_HEADERS_SOURCE=PACK_OK; exit 0; fi
          meta="/mnt/gio-meta/11/pack-11-projects.json"; test -s "$meta"
          lineage_sha="$(jq -r '.projects[] | select(.path=="vendor/lineage") | .sha' "$meta")"; test -n "$lineage_sha" -a "$lineage_sha" != null
          tmp="$RUNNER_TEMP/lineage-build-soong-Android.bp"
          curl -fL --retry 8 --retry-all-errors --connect-timeout 20 "https://raw.githubusercontent.com/crdroidandroid/android_vendor_crdroid/${lineage_sha}/build/soong/Android.bp" -o "$tmp"
          grep -q 'name: "generated_kernel_headers"' "$tmp"; mkdir -p "$(dirname "$bp")"; cp "$tmp" "$bp"
          echo "LINEAGE_SOURCE_SHA=$lineage_sha"; echo GENERATED_KERNEL_HEADERS_SOURCE=EXACT_SOURCEPACK_PIN_RESTORED
      - name: Verify immutable product pins
        shell: bash
        run: |
          set -euo pipefail
          test "$GEN" = v2-20260902
          test "$DEVICE_SHA" = fd2a90e734a101fad046736970fa4dfb492d7d78
          test "$KERNEL_SHA" = b7b27af5994f7afc11f69cfef194a8dc738842b4
          test "$VENDOR_SHA" = 483e3e7ca5828c54d8b4408b87ee14069a8d027b
          echo IMMUTABLE_PRODUCT_PINS=PASS
      - name: Restore latest persistent Soong OUT checkpoint
        uses: actions/cache/restore@v4
        with:
          path: /mnt/gio-out
          key: gio-a14-lavender-soong-out-v4-stage-${{ inputs.stage || '1' }}
          restore-keys: |
            gio-a14-lavender-soong-out-v4-stage-
      - name: Build target-files and otatools in hard-bounded slice
        id: build
        shell: bash
        run: |
          set -eo pipefail
          cd "$AOSP_ROOT"
          export OUT_DIR="$OUT_ROOT" GOGC=10
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 8G "$RUNNER_TEMP/gio.swap"
            sudo chmod 600 "$RUNNER_TEMP/gio.swap"
            sudo mkswap "$RUNNER_TEMP/gio.swap" >/dev/null
            sudo swapon "$RUNNER_TEMP/gio.swap"
          fi
          (while true; do
            echo "=== GIO_RECOVERY_V4_HEARTBEAT stage=$STAGE $(date -u +%FT%TZ) ==="
            free -h || true
            df -hT / /mnt /tmp || true
            sleep 60
          done) & hp=$!
          set +e
          setsid bash -c '
            set +u
            source build/envsetup.sh
            lunch lineage_lavender-ap2a-userdebug
            set -u
            exec nice -n 10 ionice -c2 -n7 build/soong/soong_ui.bash --make-mode target-files-package otatools-package -j1
          ' & bp=$!
          deadline=$((SECONDS + 480))
          while kill -0 "$bp" >/dev/null 2>&1 && [ "$SECONDS" -lt "$deadline" ]; do sleep 5; done
          if kill -0 "$bp" >/dev/null 2>&1; then
            echo "GIO_RECOVERY_V4_SLICE_EXPIRED=1"
            kill -TERM -- "-$bp" >/dev/null 2>&1 || true
            sleep 10
            kill -KILL -- "-$bp" >/dev/null 2>&1 || true
          fi
          wait "$bp"; rc=$?
          set -e
          kill "$hp" >/dev/null 2>&1 || true
          wait "$hp" >/dev/null 2>&1 || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          tf="$(find "$OUT_ROOT" -type f -name '*target_files*.zip' -print -quit 2>/dev/null || true)"
          ota="$(find "$OUT_ROOT" -type f -name 'otatools.zip' -print -quit 2>/dev/null || true)"
          if [ -n "$tf" ] && [ -f "$tf" ] && [ -n "$ota" ] && [ -f "$ota" ]; then echo complete=true >> "$GITHUB_OUTPUT"; else echo complete=false >> "$GITHUB_OUTPUT"; fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ] && [ "$rc" -ne 143 ]; then exit "$rc"; fi
      - name: Queue successor before checkpoint upload
        if: ${{ steps.build.outputs.complete != 'true' }}
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          stage="${STAGE:-1}"; case "$stage" in (*[!0-9]*|'') stage=1;; esac; test "$stage" -lt 40
          next=$((stage + 1)); gh workflow run gio-public-target-recovery-v4.yml --repo "$GITHUB_REPOSITORY" --ref main -f stage="$next"; echo "NEXT_RECOVERY_STAGE=$next"
      - name: Save cumulative Soong OUT checkpoint
        if: ${{ steps.build.outputs.complete != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/gio-out
          key: gio-a14-lavender-soong-out-v4-stage-${{ inputs.stage || '1' }}-${{ github.run_id }}
      - name: Collect and publish verified public base
        if: ${{ steps.build.outputs.complete == 'true' }}
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          tf="$(find "$OUT_ROOT" -type f -name '*target_files*.zip' -print -quit)"; ota="$(find "$OUT_ROOT" -type f -name 'otatools.zip' -print -quit)"; test -f "$tf"; test -f "$ota"; unzip -t "$tf" >/dev/null; unzip -t "$ota" >/dev/null
          d="$RUNNER_TEMP/public-base"; mkdir -p "$d"; cp "$tf" "$d/lavender-public-target_files.zip"; cp "$ota" "$d/otatools.zip"; cd "$d"; sha256sum lavender-public-target_files.zip otatools.zip > SHA256SUMS
          printf '%s\n' 'schema=gio.os.public-base.v4' 'sourcepack_generation=v2-20260902' 'target=lavender' 'device_sha=fd2a90e734a101fad046736970fa4dfb492d7d78' 'kernel_sha=b7b27af5994f7afc11f69cfef194a8dc738842b4' 'vendor_sha=483e3e7ca5828c54d8b4408b87ee14069a8d027b' 'private_gio_source_present=false' 'hardware_validated=false' > PROVENANCE.env
          if ! gh release view "$PUBLIC_BASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release create "$PUBLIC_BASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'GIO OS Lavender verified public base v4' --notes 'Verified public target-files and otatools; private GIO payload absent.' --prerelease; fi
          gh release upload "$PUBLIC_BASE_TAG" lavender-public-target_files.zip otatools.zip SHA256SUMS PROVENANCE.env --repo "$GITHUB_REPOSITORY" --clobber
          echo PUBLIC_BASE_V4=VERIFIED_AND_RELEASED
      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          set +e; sudo umount "$AOSP_ROOT" >/dev/null 2>&1 || true
          for mp in /mnt/gio-lower/*; do [ -d "$mp" ] && sudo umount "$mp" >/dev/null 2>&1 || true; done
          sudo dmsetup ls --noheadings -o name 2>/dev/null | awk '/^gio-public-pack-/ {print $1}' | xargs -r -n1 sudo dmsetup remove -f >/dev/null 2>&1 || true
          for dev in /dev/nbd*; do [ -b "$dev" ] && timeout 2s sudo nbd-client -d "$dev" >/dev/null 2>&1 || true; done
          sudo pkill -f nbdkit >/dev/null 2>&1 || true
